# Builds the extension, checks it, and packages it as a .vsix on every push
# and pull request. The .vsix is attached to the run as an artifact.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The PlantUML engine (media/vendor) and Monaco (media/monaco) are not
      # in the repository; the build fetches and copies them.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      # The webview tests drive the preview in Chromium.
      - name: Install Chromium for the webview tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package

      - name: Upload the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

      # Screenshots of the webview tests, to see what went wrong.
      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  # A tag v<version> publishes a GitHub release with the .vsix, described by
  # that version's section of the changelog.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section '## $version'" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: '*.vsix'
